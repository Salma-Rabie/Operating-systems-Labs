version: "3.9"

services:
  db:
    image: salmarabie/oslab-db
    container_name: mydb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: user_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - oslab-network

  backend:
    image: salmarabie/oslab-backend
    container_name: backend
    restart: always
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: 1234
      DB_NAME: user_db
    ports:
      - "3000:3000"
    volumes:
      - ~/data-of-users:/app/data 
    networks:
      - oslab-network

  frontend:
    image: salmarabie/oslab-frontend
    container_name: frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"
    networks:
      - oslab-network
      
networks:
  oslab-network:
    driver: bridge

volumes:
  db_data:
